<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOIC Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --text: #1e293b;
            --white: #ffffff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* LOGIN */
        #loginOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        #loginOverlay.hidden { display: none; }
        .login-box { background: var(--white); border-radius: 12px; padding: 40px; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-box h2 { font-size: 22px; margin-bottom: 6px; }
        .login-box p { color: var(--secondary); font-size: 13px; margin-bottom: 24px; }
        .login-error { color: var(--danger); font-size: 13px; margin-bottom: 12px; display: none; }
        .login-error.show { display: block; }

        /* HEADER */
        header { background: var(--white); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; font-weight: 700; }
        header p { font-size: 13px; color: var(--secondary); margin-top: 2px; }
        .header-btns { display: flex; gap: 10px; }

        /* TABS */
        .tabs { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; }
        .tab-btn { padding: 14px 20px; border: none; background: none; font-size: 14px; font-weight: 500; color: var(--secondary); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-btn:hover { color: var(--text); }

        /* CONTENT */
        .tab-content { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
        .tab-content.active { display: block; }

        /* PEOPLE LIST */
        .people-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .people-header h2 { font-size: 18px; font-weight: 600; }

        .person-card { background: var(--white); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .person-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; cursor: pointer; user-select: none; transition: background 0.15s; }
        .person-header:hover { background: #f1f5f9; }
        .person-header.open { background: #eff6ff; border-bottom: 1px solid var(--border); }
        .person-name { font-weight: 600; font-size: 15px; }
        .person-meta { font-size: 12px; color: var(--secondary); margin-top: 2px; }
        .person-chevron { color: var(--secondary); font-size: 18px; transition: transform 0.2s; }
        .person-header.open .person-chevron { transform: rotate(180deg); }

        .person-body { display: none; padding: 16px 20px; }
        .person-body.open { display: block; }

        .person-notes-label { font-size: 12px; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
        .person-notes { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px; resize: vertical; min-height: 60px; color: var(--text); }
        .person-notes:focus { outline: none; border-color: var(--primary); }
        .notes-save-row { display: flex; justify-content: flex-end; margin-top: 6px; margin-bottom: 16px; }

        .interactions-label { font-size: 12px; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }

        /* INTERACTION ITEMS */
        .interaction-card { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
        .interaction-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; background: var(--bg); transition: background 0.15s; }
        .interaction-header:hover { background: #e8f0fe; }
        .interaction-header.open { background: #dbeafe; border-bottom: 1px solid var(--border); }
        .interaction-title { font-size: 13px; font-weight: 600; }
        .interaction-method { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(37,99,235,0.1); color: var(--primary); }
        .interaction-chevron { color: var(--secondary); font-size: 14px; transition: transform 0.2s; }
        .interaction-header.open .interaction-chevron { transform: rotate(180deg); }

        .interaction-body { display: none; padding: 14px; }
        .interaction-body.open { display: block; }
        .interaction-field-label { font-size: 11px; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; margin-top: 12px; }
        .interaction-field-label:first-child { margin-top: 0; }
        .interaction-textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px; resize: vertical; min-height: 80px; color: var(--text); }
        .interaction-textarea:focus { outline: none; border-color: var(--primary); }
        .interaction-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .save-confirm { font-size: 12px; color: var(--success); display: none; }
        .save-confirm.show { display: inline; }

        /* BUTTONS */
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-outline { background: white; color: var(--primary); border: 1px solid var(--primary); }
        .btn-outline:hover { background: #eff6ff; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-ghost { background: none; color: var(--secondary); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--bg); }

        .add-interaction-btn { width: 100%; padding: 10px; border: 2px dashed var(--border); border-radius: 6px; background: none; color: var(--secondary); font-size: 13px; cursor: pointer; margin-top: 8px; transition: all 0.15s; }
        .add-interaction-btn:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }

        /* MODAL */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: flex; align-items: center; justify-content: center; }
        #modal.hidden { display: none; }
        .modal-box { background: white; border-radius: 12px; padding: 28px; width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal-box h2 { font-size: 18px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px; color: var(--text); }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* ADD PERSON MODAL */
        #addPersonModal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: flex; align-items: center; justify-content: center; }
        #addPersonModal.hidden { display: none; }

        /* OPPORTUNITIES */
        .opp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .opp-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .opp-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
        .opp-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 12px; margin-bottom: 8px; font-weight: 600; }
        .opp-need { background: rgba(37,99,235,0.1); color: var(--primary); }
        .opp-pain { background: rgba(220,38,38,0.1); color: var(--danger); }
        .opp-auto { background: rgba(22,163,74,0.1); color: var(--success); }
        .opp-desc { font-size: 12px; color: var(--secondary); line-height: 1.5; margin-bottom: 8px; }
        .opp-people { font-size: 11px; color: var(--secondary); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }

        /* STATUS */
        .status-bar { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
        .status-bar.show { display: block; }
        .status-bar.success { background: #dcfce7; color: #166534; }
        .status-bar.error { background: #fee2e2; color: #991b1b; }

        /* EMPTY STATE */
        .empty { text-align: center; padding: 30px; color: var(--secondary); font-size: 14px; }

        /* LOADING */
        .loading { text-align: center; padding: 40px; color: var(--secondary); }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
    <div class="login-box">
        <h2>SOIC Tracker</h2>
        <p>Enter your password to continue</p>
        <div class="login-error" id="loginError">Incorrect password. Try again.</div>
        <div class="form-group">
            <input type="password" id="passwordInput" placeholder="Password" style="margin-bottom: 12px;">
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="login()">Login</button>
    </div>
</div>

<!-- ADD INTERACTION MODAL -->
<div id="modal" class="hidden">
    <div class="modal-box">
        <h2 id="modalTitle">Log Interaction</h2>
        <div class="form-group">
            <label>Contact Method *</label>
            <select id="modalMethod">
                <option value="">Select...</option>
                <option value="email">Email</option>
                <option value="call">Call</option>
                <option value="chat">Chat</option>
                <option value="meeting">In-person Meeting</option>
                <option value="video">Video Call</option>
            </select>
        </div>
        <div class="form-group">
            <label>Date & Time *</label>
            <input type="datetime-local" id="modalDateTime">
        </div>
        <div class="form-group">
            <label>What was discussed *</label>
            <textarea id="modalDiscussion" placeholder="Summary of the conversation..."></textarea>
        </div>
        <div class="form-group">
            <label>Key decisions made</label>
            <textarea id="modalDecisions" placeholder="Any decisions or agreements made..."></textarea>
        </div>
        <div class="form-group">
            <label>Action items & next steps</label>
            <textarea id="modalActionItems" placeholder="What needs to happen next?"></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitInteraction()">Save Interaction</button>
        </div>
    </div>
</div>

<!-- ADD PERSON MODAL -->
<div id="addPersonModal" class="hidden">
    <div class="modal-box" style="width:380px;">
        <h2>Add Person</h2>
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="newPersonName" placeholder="e.g. Jane Smith">
        </div>
        <div class="form-group">
            <label>Notes (optional)</label>
            <textarea id="newPersonNotes" placeholder="Role, contact info, etc..." style="min-height:80px;"></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeAddPersonModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitAddPerson()">Add Person</button>
        </div>
    </div>
</div>

<!-- HEADER -->
<header>
    <div>
        <h1>SOIC Tracker</h1>
        <p>Track conversations, decisions, and action items with your team</p>
    </div>
    <div class="header-btns">
        <button class="btn btn-ghost btn-sm" onclick="exportBackup()">Export Backup</button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
</header>

<!-- TABS -->
<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('people')">Team & Interactions</button>
    <button class="tab-btn" onclick="switchTab('opportunities')">Opportunities</button>
</div>

<!-- PEOPLE TAB -->
<div id="peopleTab" class="tab-content active">
    <div id="statusBar" class="status-bar"></div>
    <div class="people-header">
        <h2>Team Directory</h2>
        <button class="btn btn-primary btn-sm" onclick="openAddPersonModal()">+ Add Person</button>
    </div>
    <div id="peopleContainer">
        <div class="loading">Loading...</div>
    </div>
</div>

<!-- OPPORTUNITIES TAB -->
<div id="opportunitiesTab" class="tab-content">
    <div id="oppContainer">
        <div class="loading">Loading opportunities...</div>
    </div>
</div>

<script>
    // Data API, served by this site behind Cloudflare Access (functions/api); see README.
    const API = "/api";
    const PASSWORD = "Ssoic$$2026";
    const CACHE_KEY = "soic_v2_cache";
    const PEOPLE_KEY = "soic_v2_people";

    let allInteractions = [];
    let allPeople = {};
    let currentModalPerson = null;
    let editingInteractionId = null;

    const DEFAULT_PEOPLE = [
        "Alejandro Lopez",
        "Edgar Mauricio Aguilar",
        "Jose Antonio Acevedo",
        "Jose Esparza",
        "Juan Andres Jimenez Rendon",
        "Lars Von Borstel",
        "Paola Muñoz",
        "Pedro",
        "Sebastian Barrientos"
    ];

    // AUTH
    if (sessionStorage.getItem("auth") !== "true") {
        document.getElementById("loginOverlay").classList.remove("hidden");
    } else {
        document.getElementById("loginOverlay").classList.add("hidden");
        init();
    }

    document.getElementById("passwordInput").addEventListener("keyup", function(e) {
        if (e.key === "Enter") login();
    });

    function login() {
        if (document.getElementById("passwordInput").value === PASSWORD) {
            sessionStorage.setItem("auth", "true");
            document.getElementById("loginOverlay").classList.add("hidden");
            init();
        } else {
            document.getElementById("loginError").classList.add("show");
            document.getElementById("passwordInput").value = "";
        }
    }

    function logout() {
        sessionStorage.removeItem("auth");
        location.reload();
    }

    // INIT
    async function init() {
        setDefaultDateTime();
        await loadData();
    }

    function setDefaultDateTime() {
        const now = new Date();
        const offset = now.getTimezoneOffset();
        const local = new Date(now.getTime() - offset * 60000);
        document.getElementById("modalDateTime").value = local.toISOString().slice(0, 16);
    }

    // LOAD DATA
    async function loadData() {
        // Load from cache first
        const cachedInt = sessionStorage.getItem(CACHE_KEY);
        const cachedPeople = sessionStorage.getItem(PEOPLE_KEY);
        if (cachedInt && cachedPeople) {
            try {
                allInteractions = JSON.parse(cachedInt);
                allPeople = JSON.parse(cachedPeople);
                renderPeople();
            } catch(e) {}
        }

        // Fetch fresh from API
        try {
            const [intRes, peopleRes] = await Promise.all([
                fetch(API + "/interactions"),
                fetch(API + "/people")
            ]);
            allInteractions = await intRes.json();
            if (!Array.isArray(allInteractions)) allInteractions = [];
            allPeople = await peopleRes.json();
            if (typeof allPeople !== "object") allPeople = {};

            // Ensure default people exist
            DEFAULT_PEOPLE.forEach(function(name) {
                if (!allPeople.hasOwnProperty(name)) {
                    allPeople[name] = "";
                }
            });

            sessionStorage.setItem(CACHE_KEY, JSON.stringify(allInteractions));
            sessionStorage.setItem(PEOPLE_KEY, JSON.stringify(allPeople));
            renderPeople();
        } catch(e) {
            if (!cachedInt) {
                document.getElementById("peopleContainer").innerHTML = "<div class=\"empty\">Error loading data. Please refresh.</div>";
            }
        }
    }

    // RENDER PEOPLE
    function renderPeople() {
        const container = document.getElementById("peopleContainer");
        const names = Object.keys(allPeople).sort();

        if (names.length === 0) {
            container.innerHTML = "<div class=\"empty\">No people yet. Click + Add Person to get started.</div>";
            return;
        }

        container.innerHTML = names.map(function(name) {
            const ints = allInteractions.filter(function(i) { return i.personName === name; })
                .sort(function(a, b) { return new Date(b.dateTime) - new Date(a.dateTime); });
            const lastDate = ints.length > 0 ? new Date(ints[0].dateTime).toLocaleDateString("en-US", {month: "short", day: "numeric"}) : "No interactions yet";
            const notes = allPeople[name] || "";

            return "<div class=\"person-card\" id=\"person-" + safeid(name) + "\">" +
                "<div class=\"person-header\" onclick=\"togglePerson('" + safeid(name) + "')\">" +
                    "<div>" +
                        "<div class=\"person-name\">" + name + "</div>" +
                        "<div class=\"person-meta\">" + ints.length + " interaction" + (ints.length !== 1 ? "s" : "") + " &middot; Last: " + lastDate + "</div>" +
                    "</div>" +
                    "<div style=\"display:flex;align-items:center;gap:12px;\">" +
                        "<button class=\"btn btn-danger btn-sm\" onclick=\"deletePerson(event, '" + escAttr(name) + "')\">Delete</button>" +
                        "<span class=\"person-chevron\">&#9660;</span>" +
                    "</div>" +
                "</div>" +
                "<div class=\"person-body\" id=\"body-" + safeid(name) + "\">" +
                    "<div class=\"person-notes-label\">Notes</div>" +
                    "<textarea class=\"person-notes\" id=\"notes-" + safeid(name) + "\" placeholder=\"Role, contact info, background...\">" + escHtml(notes) + "</textarea>" +
                    "<div class=\"notes-save-row\">" +
                        "<button class=\"btn btn-sm btn-outline\" onclick=\"saveNotes('" + safeid(name) + "', '" + escAttr(name) + "')\">Save Notes</button>" +
                        "<span class=\"save-confirm\" id=\"notes-confirm-" + safeid(name) + "\"> ✓ Saved</span>" +
                    "</div>" +
                    "<div class=\"interactions-label\">Interactions</div>" +
                    (ints.length === 0 ? "<div class=\"empty\" style=\"padding:16px 0;\">No interactions yet</div>" :
                        ints.map(function(i) { return renderInteractionCard(i); }).join("")) +
                    "<button class=\"add-interaction-btn\" onclick=\"openModal('" + escAttr(name) + "')\">+ Add Interaction</button>" +
                "</div>" +
            "</div>";
        }).join("");
    }

    function renderInteractionCard(i) {
        const date = new Date(i.dateTime).toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"});
        const time = new Date(i.dateTime).toLocaleTimeString("en-US", {hour: "2-digit", minute: "2-digit"});
        return "<div class=\"interaction-card\" id=\"int-" + i.id + "\">" +
            "<div class=\"interaction-header\" onclick=\"toggleInteraction('" + i.id + "')\">"+
                "<div style=\"display:flex;align-items:center;gap:10px;\">" +
                    "<span class=\"interaction-title\">" + date + " at " + time + "</span>" +
                    "<span class=\"interaction-method\">" + i.contactMethod + "</span>" +
                "</div>" +
                "<span class=\"interaction-chevron\">&#9660;</span>" +
            "</div>" +
            "<div class=\"interaction-body\" id=\"intbody-" + i.id + "\">" +
                "<div class=\"interaction-field-label\">Discussion</div>" +
                "<textarea class=\"interaction-textarea\" id=\"disc-" + i.id + "\">" + escHtml(i.discussion || "") + "</textarea>" +
                "<div class=\"interaction-field-label\">Key Decisions</div>" +
                "<textarea class=\"interaction-textarea\" style=\"min-height:60px;\" id=\"dec-" + i.id + "\">" + escHtml(i.decisions || "") + "</textarea>" +
                "<div class=\"interaction-field-label\">Action Items</div>" +
                "<textarea class=\"interaction-textarea\" style=\"min-height:60px;\" id=\"act-" + i.id + "\">" + escHtml(i.actionItems || "") + "</textarea>" +
                "<div class=\"interaction-actions\">" +
                    "<button class=\"btn btn-danger btn-sm\" onclick=\"deleteInteraction('" + i.id + "')\">Delete</button>" +
                    "<div style=\"display:flex;align-items:center;gap:10px;\">" +
                        "<span class=\"save-confirm\" id=\"int-confirm-" + i.id + "\">✓ Saved</span>" +
                        "<button class=\"btn btn-primary btn-sm\" onclick=\"saveInteraction('" + i.id + "')\">Save Changes</button>" +
                    "</div>" +
                "</div>" +
            "</div>" +
        "</div>";
    }

    // TOGGLE ACCORDIONS
    function togglePerson(safeName) {
        const header = document.querySelector("#person-" + safeName + " .person-header");
        const body = document.getElementById("body-" + safeName);
        header.classList.toggle("open");
        body.classList.toggle("open");
    }

    function toggleInteraction(id) {
        const header = document.querySelector("#int-" + id + " .interaction-header");
        const body = document.getElementById("intbody-" + id);
        header.classList.toggle("open");
        body.classList.toggle("open");
    }

    // SAVE NOTES
    async function saveNotes(safeName, name) {
        const notes = document.getElementById("notes-" + safeName).value;
        allPeople[name] = notes;
        try {
            await fetch(API + "/people", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(allPeople)
            });
            sessionStorage.setItem(PEOPLE_KEY, JSON.stringify(allPeople));
            const confirm = document.getElementById("notes-confirm-" + safeName);
            confirm.classList.add("show");
            setTimeout(function() { confirm.classList.remove("show"); }, 2000);
        } catch(e) {
            showStatus("Error saving notes: " + e.message, "error");
        }
    }

    // SAVE INTERACTION EDITS
    async function saveInteraction(id) {
        const discussion = document.getElementById("disc-" + id).value;
        const decisions = document.getElementById("dec-" + id).value;
        const actionItems = document.getElementById("act-" + id).value;

        try {
            const res = await fetch(API + "/interactions/" + id, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({discussion: discussion, decisions: decisions, actionItems: actionItems})
            });
            if (!res.ok) throw new Error("Save failed");

            const int = allInteractions.find(function(i) { return String(i.id) === String(id); });
            if (int) { int.discussion = discussion; int.decisions = decisions; int.actionItems = actionItems; }
            sessionStorage.setItem(CACHE_KEY, JSON.stringify(allInteractions));

            const confirm = document.getElementById("int-confirm-" + id);
            confirm.classList.add("show");
            setTimeout(function() { confirm.classList.remove("show"); }, 2000);
        } catch(e) {
            showStatus("Error saving: " + e.message, "error");
        }
    }

    // DELETE INTERACTION
    async function deleteInteraction(id) {
        if (!confirm("Delete this interaction?")) return;
        try {
            const res = await fetch(API + "/interactions/" + id, {method: "DELETE"});
            if (!res.ok) throw new Error("Delete failed");
            allInteractions = allInteractions.filter(function(i) { return String(i.id) !== String(id); });
            sessionStorage.setItem(CACHE_KEY, JSON.stringify(allInteractions));
            renderPeople();
        } catch(e) {
            showStatus("Error deleting: " + e.message, "error");
        }
    }

    // ADD INTERACTION MODAL
    function openModal(personName) {
        currentModalPerson = personName;
        editingInteractionId = null;
        document.getElementById("modalTitle").textContent = "Log Interaction — " + personName;
        document.getElementById("modalMethod").value = "";
        document.getElementById("modalDiscussion").value = "";
        document.getElementById("modalDecisions").value = "";
        document.getElementById("modalActionItems").value = "";
        setDefaultDateTime();
        document.getElementById("modal").classList.remove("hidden");
    }

    function closeModal() {
        document.getElementById("modal").classList.add("hidden");
        currentModalPerson = null;
    }

    async function submitInteraction() {
        const method = document.getElementById("modalMethod").value;
        const dateTime = document.getElementById("modalDateTime").value;
        const discussion = document.getElementById("modalDiscussion").value.trim();

        if (!method || !dateTime || !discussion) {
            alert("Please fill in Contact Method, Date/Time, and Discussion.");
            return;
        }

        const interaction = {
            id: String(Date.now()),
            personName: currentModalPerson,
            contactMethod: method,
            dateTime: dateTime,
            discussion: discussion,
            decisions: document.getElementById("modalDecisions").value.trim(),
            actionItems: document.getElementById("modalActionItems").value.trim()
        };

        try {
            const res = await fetch(API + "/interactions", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(interaction)
            });
            if (!res.ok) throw new Error("Save failed");
            allInteractions.push(interaction);
            sessionStorage.setItem(CACHE_KEY, JSON.stringify(allInteractions));
            closeModal();
            renderPeople();
            // Re-open the person accordion
            setTimeout(function() {
                const safeName = safeid(currentModalPerson || interaction.personName);
                const header = document.querySelector("#person-" + safeid(interaction.personName) + " .person-header");
                const body = document.getElementById("body-" + safeid(interaction.personName));
                if (header && !header.classList.contains("open")) {
                    header.classList.add("open");
                    body.classList.add("open");
                }
            }, 50);
            showStatus("Interaction logged!", "success");
        } catch(e) {
            showStatus("Error saving: " + e.message, "error");
        }
    }

    // ADD PERSON
    function openAddPersonModal() {
        document.getElementById("newPersonName").value = "";
        document.getElementById("newPersonNotes").value = "";
        document.getElementById("addPersonModal").classList.remove("hidden");
        setTimeout(function() { document.getElementById("newPersonName").focus(); }, 50);
    }

    function closeAddPersonModal() {
        document.getElementById("addPersonModal").classList.add("hidden");
    }

    async function submitAddPerson() {
        const name = document.getElementById("newPersonName").value.trim();
        if (!name) { alert("Please enter a name."); return; }
        if (allPeople.hasOwnProperty(name)) { alert("This person already exists."); return; }

        const notes = document.getElementById("newPersonNotes").value.trim();
        allPeople[name] = notes;

        try {
            await fetch(API + "/people", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(allPeople)
            });
            sessionStorage.setItem(PEOPLE_KEY, JSON.stringify(allPeople));
            closeAddPersonModal();
            renderPeople();
            showStatus(name + " added!", "success");
        } catch(e) {
            showStatus("Error adding person: " + e.message, "error");
        }
    }

    // TABS
    function switchTab(tab) {
        document.querySelectorAll(".tab-content").forEach(function(el) { el.classList.remove("active"); });
        document.querySelectorAll(".tab-btn").forEach(function(el) { el.classList.remove("active"); });
        if (tab === "people") {
            document.getElementById("peopleTab").classList.add("active");
            document.querySelectorAll(".tab-btn")[0].classList.add("active");
        } else {
            document.getElementById("opportunitiesTab").classList.add("active");
            document.querySelectorAll(".tab-btn")[1].classList.add("active");
            renderOpportunities();
        }
    }

    // OPPORTUNITIES
    function renderOpportunities() {
        const themes = [
            {title: "Automated Pricing Tool", badge: "opp-auto", label: "AUTOMATION", keywords: ["pric", "cost", "percentages", "convoluted"], desc: "Pricing is manual and complex. An automated tool capturing freight, insurance, and margins would save time and reduce errors."},
            {title: "Order & Customer Visibility Platform", badge: "opp-need", label: "NEED", keywords: ["visibility", "order status", "updates", "tracking", "where orders are"], desc: "Sales team needs real-time visibility into order status without relying on email chains."},
            {title: "Supply-Demand Matching", badge: "opp-pain", label: "PAIN POINT", keywords: ["supply", "demand", "buyer", "tonnage", "available"], desc: "When supply is available but no buyer is identified, revenue is lost."},
            {title: "Centralized Customer & Product Database", badge: "opp-need", label: "NEED", keywords: ["all the info", "same place", "database", "centralized", "customer needs", "specifications"], desc: "Information is scattered. A single source of truth for customers, products and specs is needed."},
            {title: "Market Pricing & Import Data", badge: "opp-need", label: "NEED", keywords: ["data sur", "market data", "import data", "what people are paying", "gsm"], desc: "Access to market intelligence on competitor pricing and product specs would improve decisions."},
            {title: "Delivery Reliability", badge: "opp-pain", label: "PAIN POINT", keywords: ["deliver", "late", "mill", "carman", "operations", "on time"], desc: "Late deliveries are a recurring issue. Both sales staff and clients lack operational visibility."}
        ];

        const container = document.getElementById("oppContainer");
        const results = themes.map(function(t) {
            const mentions = allInteractions.filter(function(i) {
                const text = ((i.discussion || "") + " " + (i.decisions || "")).toLowerCase();
                return t.keywords.some(function(kw) { return text.includes(kw); });
            });
            const people = [...new Set(mentions.map(function(i) { return i.personName; }))];
            return {theme: t, count: mentions.length, people: people};
        }).filter(function(r) { return r.count > 0; }).sort(function(a, b) { return b.count - a.count; });

        if (results.length === 0) {
            container.innerHTML = "<div class=\"empty\">Log more interactions to see opportunities emerge.</div>";
            return;
        }

        container.innerHTML = "<h2 style=\"font-size:18px;font-weight:600;margin-bottom:16px;\">Top Opportunities</h2><div class=\"opp-grid\">" +
            results.map(function(r) {
                return "<div class=\"opp-card\">" +
                    "<div class=\"opp-title\">" + r.theme.title + "</div>" +
                    "<span class=\"opp-badge " + r.theme.badge + "\">" + r.theme.label + "</span>" +
                    "<div class=\"opp-desc\">" + r.theme.desc + "</div>" +
                    "<div class=\"opp-people\">" + r.count + " mention" + (r.count !== 1 ? "s" : "") + " &mdash; " + r.people.join(", ") + "</div>" +
                "</div>";
            }).join("") + "</div>";
    }

    async function deletePerson(event, name) {
        event.stopPropagation();
        if (!confirm("Delete " + name + "? This will not delete their interactions.")) return;
        delete allPeople[name];
        try {
            await fetch(API + "/people", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(allPeople)
            });
            sessionStorage.setItem(PEOPLE_KEY, JSON.stringify(allPeople));
            renderPeople();
            showStatus(name + " removed.", "success");
        } catch(e) {
            showStatus("Error removing person: " + e.message, "error");
        }
    }

    // EXPORT
    async function exportBackup() {
        try {
            const backup = {exportedAt: new Date().toISOString(), interactions: allInteractions, peopleNotes: allPeople};
            const blob = new Blob([JSON.stringify(backup, null, 2)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "soic-backup-" + new Date().toISOString().slice(0, 10) + ".json";
            a.click();
            URL.revokeObjectURL(url);
        } catch(e) {
            showStatus("Export failed: " + e.message, "error");
        }
    }

    // HELPERS
    function safeid(name) {
        return name.replace(/[^a-zA-Z0-9]/g, "_");
    }

    function escHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escAttr(str) {
        return String(str).replace(/'/g, "\'").replace(/"/g, "&quot;");
    }

    function showStatus(msg, type) {
        const bar = document.getElementById("statusBar");
        bar.textContent = msg;
        bar.className = "status-bar " + type + " show";
        setTimeout(function() { bar.classList.remove("show"); }, 3000);
    }

    document.getElementById("newPersonName").addEventListener("keyup", function(e) {
        if (e.key === "Enter") submitAddPerson();
    });
</script>
</body>
</html>
